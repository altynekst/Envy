name: reverse-envy
on:
  workflow_dispatch:
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java + тулзы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip wget zip >/dev/null
      - name: jadx
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q jadx-1.5.0.zip -d jadx
      - name: apktool
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool
      - name: Инфо
        run: |
          ls -lh reverse/envy.apk
          unzip -l reverse/envy.apk | grep -E '\.so$|classes.*\.dex' | head -100
      - name: apktool d
        run: ./apktool d -f reverse/envy.apk -o out/apktool
      - name: jadx
        run: ./jadx/bin/jadx -d out/jadx --no-res reverse/envy.apk
      - name: .so
        run: |
          mkdir -p out/natives
          unzip -o -q reverse/envy.apk 'lib/*' -d out/natives
          find out/natives -name '*.so' -exec ls -lh {} \;
      - name: Ghidra
        run: |
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_11.0.3_PUBLIC_20240410.zip
          GHIDRA=$(pwd)/ghidra_11.0.3_PUBLIC
          mkdir -p out/ghidra
          cat > DumpAll.java << 'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.*;
          import ghidra.program.model.listing.*;
          import java.io.*;
          public class DumpAll extends GhidraScript {
            public void run() throws Exception {
              DecompInterface ifc = new DecompInterface();
              ifc.openProgram(currentProgram);
              String name = currentProgram.getName();
              File out = new File(getScriptArgs()[0] + "/" + name + ".c");
              PrintWriter pw = new PrintWriter(new FileWriter(out));
              for (Function f : currentProgram.getFunctionManager().getFunctions(true)) {
                DecompileResults r = ifc.decompileFunction(f, 30, monitor);
                pw.println("// ===== " + f.getName() + " @ " + f.getEntryPoint() + " =====");
                if (r != null && r.decompileCompleted()) pw.println(r.getDecompiledFunction().getC());
                pw.println();
              }
              pw.close();
            }
          }
          JAVA
          for so in $(find out/natives -name '*.so'); do
            base=$(basename "$so")
            $GHIDRA/support/analyzeHeadless "$(pwd)/ghidra_proj_$base" proj \
              -import "$so" \
              -postScript DumpAll.java "$(pwd)/out/ghidra" \
              -scriptPath "$(pwd)" \
              -deleteProject 2>&1 | tail -3 || true
          done
          ls -lh out/ghidra
      - name: Zip
        run: zip -qr reverse-envy.zip out
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-envy
          path: reverse-envy.zip
          retention-days: 7

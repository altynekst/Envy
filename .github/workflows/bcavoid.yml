name: bcavoid-decomp
on:
  workflow_dispatch:
jobs:
  decomp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reverse-envy
          path: .
        continue-on-error: true
      - name: Распаковать артефакт
        run: |
          if [ -f reverse-envy.zip ]; then unzip -q reverse-envy.zip; fi
          find . -name 'libDDNet.so' -exec ls -lh {} \;
      - name: Java + Ghidra
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jdk unzip wget >/dev/null
          wget -q https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          unzip -q ghidra_11.0.3_PUBLIC_20240410.zip
          echo "GHIDRA=$(pwd)/ghidra_11.0.3_PUBLIC" >> $GITHUB_ENV
      - name: DumpOnly BcAvoid
        run: |
          SO=$(find . -name 'libDDNet.so' | head -1)
          mkdir -p out
          cat > DumpFiltered.java << 'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.app.decompiler.*;
          import ghidra.program.model.listing.*;
          import java.io.*;
          public class DumpFiltered extends GhidraScript {
            public void run() throws Exception {
              DecompInterface ifc = new DecompInterface();
              ifc.openProgram(currentProgram);
              String[] args = getScriptArgs();
              String outPath = args[0];
              String needle = args.length > 1 ? args[1] : "BcAvoid";
              File out = new File(outPath);
              PrintWriter pw = new PrintWriter(new FileWriter(out));
              int n = 0;
              for (Function f : currentProgram.getFunctionManager().getFunctions(true)) {
                String fn = f.getName();
                if (!fn.contains(needle) && !fn.contains("BcAvoid")) continue;
                DecompileResults r = ifc.decompileFunction(f, 60, monitor);
                pw.println("// ===== " + fn + " @ " + f.getEntryPoint() + " =====");
                if (r != null && r.decompileCompleted()) {
                  pw.println(r.getDecompiledFunction().getC());
                } else {
                  pw.println("// (decompile failed)");
                }
                pw.println();
                n++;
              }
              pw.close();
              println("dumped " + n + " functions");
            }
          }
          JAVA
          $GHIDRA/support/analyzeHeadless "$(pwd)/proj" proj \
            -import "$SO" \
            -postScript DumpFiltered.java "$(pwd)/out/bcavoid.c" BcAvoid \
            -scriptPath "$(pwd)" \
            -deleteProject 2>&1 | tail -10
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: bcavoid-c
          path: out/bcavoid.c
